name: Publish signed Windows and Android release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish or retry
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: focus-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Validate version and signing secret
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY secret' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -ne $tauriVersion) { throw 'Package and Tauri versions differ' }
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Run this workflow on the matching version tag' }
          $normalized = $env:SIGNING_KEY -replace '\s', ''
          if ($normalized -notmatch '^[A-Za-z0-9+/]+={0,2}$') { throw 'Private key secret must contain only the Base64 key, without headers' }
          try { $null = [Convert]::FromBase64String($normalized) } catch { throw 'Private key secret is not valid Base64' }
          Write-Output "::add-mask::$normalized"
          "TAURI_SIGNING_PRIVATE_KEY=$normalized" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build signed installer and updater manifest
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Focus v__VERSION__
          releaseBody: "Instaladores firmados para Windows x64 y Android ARM64. Consulta las notas en docs/releases de esta versión. Android detecta nuevas versiones desde Focus y abre la descarga del APK; confirma la instalación sin desinstalar la app."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
      - name: Verify Windows assets and upload checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "src-tauri/target/release/bundle/nsis/Focus_${version}_x64-setup.exe"
          if (!(Test-Path -LiteralPath "$installer.sig")) { throw 'Installer signature missing' }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Focus_${version}_x64-setup.exe" | Set-Content SHA256SUMS.txt -Encoding ascii
          gh release upload "v$version" SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Checksum upload failed' }
          gh release download "v$version" --pattern latest.json --dir updater-check
          if ($LASTEXITCODE -ne 0) { throw 'Updater manifest missing' }
          $manifest = Get-Content updater-check/latest.json -Raw | ConvertFrom-Json
          $platform = $manifest.platforms.'windows-x86_64'
          if ($manifest.version.TrimStart('v') -ne $version -or !$platform.url -or !$platform.signature) { throw 'Invalid updater manifest' }
          $signature = (Get-Content -LiteralPath "$installer.sig" -Raw).Trim()
          if ($platform.signature.Trim() -ne $signature) { throw 'Updater signature does not match installer' }

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          chmod +x src-tauri/gen/android/gradlew
      - name: Configure permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 tests/android-signing.py
          python3 scripts/configure-android-ci.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm tauri android build --apk --target aarch64
      - name: Verify APK and prepare release assets
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./package.json').version")
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -i 'certificate SHA-256 digest: 510614a7c250d94da6d6a82244428bfddcc5d86aaefb945896efaea3c971fb12' "$RUNNER_TEMP/apk-signature.txt"
          keytool -exportcert -keystore "$RUNNER_TEMP/focus-release.jks" -alias focus-release -storepass:env ANDROID_KEY_PASSWORD -file "$RUNNER_TEMP/focus-release.cer"
          echo '510614a7c250d94da6d6a82244428bfddcc5d86aaefb945896efaea3c971fb12  '"$RUNNER_TEMP/focus-release.cer" | sha256sum -c -
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then exit 1; fi
          grep -F "name='com.focus.app'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionName='$version'" "$RUNNER_TEMP/apk-badging.txt"
          mkdir -p android-release
          cp "$apk" "android-release/Focus_${version}_arm64.apk"
          cd android-release
          sha256sum "Focus_${version}_arm64.apk" > ANDROID-SHA256SUMS.txt
      - name: Upload Android assets to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release upload "v$version" android-release/* --clobber
      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/focus-release.jks" "$RUNNER_TEMP/focus-release.cer" src-tauri/gen/android/keystore.properties

  publish:
    needs: [release, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version"
          mkdir verify-release
          gh release download "$RELEASE_TAG" --dir verify-release
          test -s verify-release/latest.json
          test -s "verify-release/Focus_${version}_x64-setup.exe.sig"
          cd verify-release
          sha256sum -c SHA256SUMS.txt
          sha256sum -c ANDROID-SHA256SUMS.txt
          cd ..
          gh release edit "$RELEASE_TAG" --draft=false --latest
